# The site is plain HTML/CSS/JS: no build step, publish the folder as it is.
[build]
  publish = "."
  command = ""

# code always revalidates, so a new deploy shows up at once (index.html also adds ?v= to each file)
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# images and fonts can be cached for a week
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
